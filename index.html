<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PostHog Engineering Impact — Last 90 Days</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1:       #2a78d6; /* Shipped Scope */
    --series-2:       #eb6834; /* Leverage on Others */
    --series-3:       #1baf7a; /* Domain Stewardship */
    --card-bg:        #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --series-3:       #199e70;
      --card-bg:        #1f1f1e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --card-bg:        #1f1f1e;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
  }
  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 20px 24px 32px;
  }
  header.top {
    margin-bottom: 16px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .methodology-line {
    color: var(--text-secondary);
    font-size: 13px;
    max-width: 900px;
    line-height: 1.45;
    margin: 0 0 8px;
  }
  .freshness {
    color: var(--text-muted);
    font-size: 12.5px;
  }
  .legend {
    display: flex;
    gap: 16px;
    margin: 14px 0 10px;
    font-size: 12.5px;
    color: var(--text-secondary);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card-toggle {
    appearance: none;
    border: 0;
    width: 100%;
    padding: 10px 16px;
    color: inherit;
    background: transparent;
    font: inherit;
    text-align: left;
    cursor: pointer;
    display: grid;
    grid-template-columns: 34px 170px minmax(220px, 1fr) 300px;
    gap: 16px;
    align-items: center;
  }
  .card-toggle:hover { background: color-mix(in srgb, var(--gridline) 35%, transparent); }
  .card-toggle:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }
  .rank {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-muted);
  }
  .who { min-width: 0; }
  .login { font-weight: 600; font-size: 14.5px; color: var(--text-primary); text-decoration: none; }
  .login:hover { text-decoration: underline; }
  .conf { color: var(--text-muted); font-size: 11.5px; margin-top: 1px; }
  .why { min-width: 0; }
  .why-text { font-size: 12.5px; color: var(--text-secondary); line-height: 1.4; margin-bottom: 4px; }
  .prs { display: flex; gap: 8px; flex-wrap: wrap; }
  .prs a {
    font-size: 11.5px;
    color: var(--series-1);
    text-decoration: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
  }
  .prs a:hover { text-decoration: underline; }
  .card-expanded { display: none; border-top: 1px solid var(--gridline); padding: 12px 16px 14px 220px; }
  .card.expanded .card-expanded { display: block; }
  .evidence-title { margin: 0 0 8px; font-size: 12px; font-weight: 650; color: var(--text-secondary); }
  .evidence-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
  .evidence-list a { color: var(--text-primary); text-decoration: none; font-size: 12.5px; }
  .evidence-list a:hover { text-decoration: underline; }
  .evidence-kind { display: inline-block; min-width: 102px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }

  .metric-controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .metric-controls button { border: 1px solid var(--border); border-radius: 999px; background: var(--card-bg); color: var(--text-secondary); padding: 5px 11px; cursor: pointer; font: inherit; font-size: 12px; }
  .metric-controls button[aria-pressed="true"] { background: var(--text-primary); color: var(--page); }

  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-label { width: 60px; font-size: 11px; color: var(--text-muted); text-align: right; flex-shrink: 0; }
  .bar-track {
    flex: 1;
    height: 14px;
    background-color: var(--gridline);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
    background-image:
      linear-gradient(to right, var(--baseline) 1px, transparent 1px),
      linear-gradient(to right, var(--baseline) 1px, transparent 1px),
      linear-gradient(to right, var(--baseline) 1px, transparent 1px);
    background-size: 25% 100%, 50% 100%, 75% 100%;
    background-repeat: no-repeat;
    background-position: 25% 0, 50% 0, 75% 0;
  }
  .bar-fill { display: block; height: 100%; border-radius: 4px; position: relative; z-index: 1; min-width: 3px; }
  .bar-track { display: block; }
  .bar-val { width: 30px; font-size: 11px; color: var(--text-secondary); text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .score-row.bar-row .bar-track { height: 22px; border-radius: 5px; }
  .score-row.bar-row .bar-fill { border-radius: 5px; background: var(--text-primary); }
  .score-row.bar-row .bar-val { width: 36px; font-size: 18px; font-weight: 700; color: var(--text-primary); }
  .score-row.bar-row .bar-label { font-size: 11px; font-weight: 600; color: var(--text-secondary); }

  .cutline {
    margin: 14px 2px;
    font-size: 12px;
    color: var(--text-muted);
  }

  details.methodology {
    margin-top: 18px;
    border-top: 1px solid var(--gridline);
    padding-top: 12px;
  }
  details.methodology summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .method-body {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.55;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .method-body h4 { margin: 0 0 4px; color: var(--text-primary); font-size: 12.5px; }
  .method-body p { margin: 0 0 10px; }

  footer.bottom {
    margin-top: 14px;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .loading, .error {
    padding: 40px;
    text-align: center;
    color: var(--text-muted);
  }
  @media (max-width: 850px) {
    .card-toggle { grid-template-columns: 30px 1fr; }
    .why, .bars { grid-column: 2; }
    .card-expanded { padding-left: 60px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>PostHog Engineering Impact — Last 90 Days</h1>
    <p class="methodology-line" id="methodology-line">Loading methodology…</p>
    <p class="freshness" id="freshness">Loading…</p>
  </header>

  <div class="legend">
    <span><span class="dot" style="background:var(--series-1)"></span>Shipped Scope (45%)</span>
    <span><span class="dot" style="background:var(--series-2)"></span>Leverage on Others (35%)</span>
    <span><span class="dot" style="background:var(--series-3)"></span>Domain Stewardship (20%)</span>
  </div>

  <div class="metric-controls" aria-label="Rank engineers by component">
    <button type="button" data-metric="overall" aria-pressed="true">Overall</button>
    <button type="button" data-metric="shipped">Shipped</button>
    <button type="button" data-metric="review">Review</button>
    <button type="button" data-metric="stewardship">Stewardship</button>
  </div>

  <div class="cards" id="cards">
    <div class="loading">Loading rankings…</div>
  </div>

  <p class="cutline" id="cutline"></p>

  <details class="methodology">
    <summary>How this works</summary>
    <div class="method-body" id="method-body"></div>
    <p style="margin-top:12px;font-size:12px;color:var(--text-secondary)">
      Full formulas and worked examples: <a href="methodology/" style="color:var(--series-1)">methodology</a>
      · Deferred features and why: <a href="roadmap.html" style="color:var(--series-1)">roadmap</a>
    </p>
  </details>

  <footer class="bottom" id="footer"></footer>
</div>

<script>
async function main() {
  let data;
  try {
    const res = await fetch('data/scores.json');
    data = await res.json();
  } catch (e) {
    document.getElementById('cards').innerHTML = '<div class="error">Could not load data/scores.json — ' + e + '</div>';
    return;
  }
  render(data);
}

function pct(v) { return Math.max(2, Math.round(v)); }

let currentData;
let activeMetric = 'overall';
const metricConfig = {
  overall: { label: 'Impact Score', value: r => r.impact_score },
  shipped: { label: 'Shipped', value: r => r.components.shipped_scope },
  review: { label: 'Review', value: r => r.components.leverage_on_others },
  stewardship: { label: 'Stewardship', value: r => r.components.domain_stewardship },
};

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function cardHTML(r, displayRank, whyOverride) {
  const evidence = [
    ...r.evidence.top_shipped.map(p => ({...p, kind: 'shipped evidence'})),
    ...(r.evidence.best_review ? [{...r.evidence.best_review, kind: 'review evidence'}] : []),
  ];
  const cardId = `card-details-${displayRank}`;
  const evidenceLinks = evidence.map(p =>
    `<li><span class="evidence-kind">${p.kind}</span><a href="${escapeHTML(p.url)}" target="_blank" rel="noopener">#${p.number} — ${escapeHTML(p.title)}</a></li>`
  ).join('');
  const whyText = whyOverride || defaultWhy(r);
  return `
    <article class="card">
      <div class="card-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="${cardId}" onclick="toggleCard(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCard(this)}">
      <div class="rank">#${displayRank}</div>
      <div class="who">
        <a class="login" href="https://github.com/${encodeURIComponent(r.login)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHTML(r.login)}</a>
        <div class="conf">${r.confidence.label} evidence — ${r.confidence.authored_prs} authored PR${r.confidence.authored_prs===1?'':'s'}, ${r.confidence.substantive_reviews} substantive review${r.confidence.substantive_reviews===1?'':'s'}</div>
        <div class="conf">${r.stats.merged_prs} merged PRs · ${r.stats.distinct_collaborators} collaborators${r.stats.median_hours_to_merge!=null ? ' · ' + Math.round(r.stats.median_hours_to_merge) + 'h median to merge' : ''}</div>
      </div>
      <div class="why">
        <div class="why-text">${escapeHTML(whyText)}</div>
        <div class="conf">Click to inspect supporting PR titles</div>
      </div>
      <div class="bars">
        ${barRow('Impact Score', r.impact_score, null, true)}
        ${barRow('Shipped', r.components.shipped_scope, 'var(--series-1)')}
        ${barRow('Leverage', r.components.leverage_on_others, 'var(--series-2)')}
        ${barRow('Stewardship', r.components.domain_stewardship, 'var(--series-3)')}
      </div>
      </div>
      <div class="card-expanded" id="${cardId}">
        <p class="evidence-title">Supporting evidence</p>
        <ul class="evidence-list">${evidenceLinks || '<li>No linked PR evidence</li>'}</ul>
      </div>
    </article>`;
}

function barRow(label, value, color, isScore) {
  const rowClass = isScore ? 'bar-row score-row' : 'bar-row';
  const fillStyle = isScore ? `width:${pct(value)}%` : `width:${pct(value)}%;background:${color}`;
  return `<div class="${rowClass}">
    <span class="bar-label">${label}</span>
    <span class="bar-track"><span class="bar-fill" style="${fillStyle}"></span></span>
    <span class="bar-val">${Number(value).toFixed(1)}</span>
  </div>`;
}

function defaultWhy(r) {
  const c = r.components;
  const top = Object.entries({shipped: c.shipped_scope, leverage: c.leverage_on_others, stewardship: c.domain_stewardship})
    .sort((a,b) => b[1]-a[1])[0][0];
  const label = { shipped: 'broad structural reach across shared code', leverage: 'high review leverage helping teammates ship', stewardship: 'sustained activity across multiple subsystems' }[top];
  return `Ranks strongly on ${label}.`;
}

function toggleCard(button) {
  const card = button.closest('.card');
  const expanded = card.classList.toggle('expanded');
  button.setAttribute('aria-expanded', String(expanded));
}

function renderRankings() {
  const cfg = metricConfig[activeMetric];
  const ranked = [...currentData.rankings].sort((a, b) => cfg.value(b) - cfg.value(a) || a.login.localeCompare(b.login));
  const top10 = ranked.slice(0, 10);
  document.getElementById('cards').innerHTML = top10.map((r, i) => cardHTML(r, i + 1, (currentData.why_overrides || {})[r.login])).join('');
  document.getElementById('cutline').textContent = `Showing the top 10 by ${cfg.label.toLowerCase()}. Select another component to re-rank.`;
}

function render(data) {
  currentData = data;
  document.getElementById('methodology-line').textContent = data.meta.methodology;
  document.getElementById('freshness').textContent =
    `${data.meta.total_prs.toLocaleString()} merged PRs from ${data.meta.eligible_engineers} engineers analyzed, ` +
    `${data.meta.window_start} to ${data.meta.window_end}. ` +
    `${data.meta.bot_authored_prs_excluded} bot-authored and ${data.meta.mechanical_prs_excluded} mechanical PRs excluded from scoring.`;

  renderRankings();

  document.getElementById('method-body').innerHTML = `
    <div>
      <h4>Shipped Scope / Blast Radius — 45%</h4>
      <p>Co-touch centrality: for every merged PR, we count how many <em>other</em> engineers also touched the same files elsewhere in the 90-day window, take the <strong>mean damped weight across that PR's files</strong>, then take the <strong>mean across each engineer's PRs</strong>. Both levels are averages, so a PR does not score higher merely because it contains more files, and the component is not won by whoever merged the most PRs. It is a proxy for engineering blast radius, not a claim about customer or revenue impact. Mechanical PRs (lockfile-only diffs and dependency bumps) are excluded from scored components.</p>
      <h4>Leverage on Others — 35%</h4>
      <p>Substantive reviews given to other engineers' PRs (state APPROVED/CHANGES_REQUESTED with a non-trivial comment body — rubber-stamp approvals don't count), multiplied by <code>log1p</code> of the number of distinct teammates reviewed. There is no speed modifier because GitHub does not provide a reliable request-to-first-review interval for resolved requests. Review connections are fully paginated; GitHub Apps and automated tools are excluded by actor type and known-account markers.</p>
    </div>
    <div>
      <h4>Domain Stewardship — 20%</h4>
      <p>PR titles are parsed for their conventional-commit scope (e.g. <code>feat(scope): …</code>); when a title has no scope (${data.meta.scope_fallback_pct}% of PRs), we fall back to the dominant top-level directory of the changed files. Within each scope, the top-2 most active engineers by authored + substantive reviewed activity earn stewardship credit. This shows sustained activity around an area; it does not claim work was actively routed to that person.</p>
      <h4>Evidence confidence &amp; ranking</h4>
      <p>Every engineer with at least one qualifying contribution is ranked — there is no minimum-activity cutoff, so someone who shipped one large piece of infrastructure and spent the rest of the window reviewing can still surface. The confidence label shows how much evidence backs the number; it affects how a score should be <em>read</em>, never the ranking itself. All three components are percentile-ranked (not min-max normalized) across the eligible engineer set so a single volume outlier can't compress everyone else's score.</p>
    </div>`;

  document.getElementById('footer').textContent =
    `Source: PostHog/posthog · Generated ${new Date(data.meta.generated_at || Date.now()).toISOString().slice(0,16).replace('T',' ')} UTC · Ranking is fully deterministic (Python); no LLM in the scoring path.`;
}

document.querySelectorAll('.metric-controls button').forEach(button => {
  button.addEventListener('click', () => {
    activeMetric = button.dataset.metric;
    document.querySelectorAll('.metric-controls button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
    renderRankings();
  });
});

main();
</script>
</body>
</html>
